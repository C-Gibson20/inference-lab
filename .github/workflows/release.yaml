name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install project
        run: uv sync --dev --locked

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          set +e
          output=$(uv run python scripts/release.py --dry-run 2>&1)
          status=$?
          set -e

          if [[ "$status" -ne 0 ]]; then
            if [[ "$output" == *"No feat, fix, perf, or breaking commit requires a bump."* ]]; then
              echo "No release-worthy commits since the latest tag."
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$output" >&2
            exit "$status"
          fi

          echo "Next version: $output"
          echo "version=$output" >> "$GITHUB_OUTPUT"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Apply version and changelog update
        if: steps.version.outputs.needed == 'true'
        run: uv run python scripts/release.py

      - name: Commit and tag release
        if: steps.version.outputs.needed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "[tooling] chore: release v${RELEASE_VERSION}"
          git tag "v${RELEASE_VERSION}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${RELEASE_VERSION}" --generate-notes --title "v${RELEASE_VERSION}"
