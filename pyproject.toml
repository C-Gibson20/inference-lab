[project]
name = "inference-lab"
version = "0.1.0"
description = "Local, provenance-preserving question answering over papers and patents"
authors = [
    { name = "C-Gibson20", email = "cg.c0d3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "torch==2.8.0",
    "transformers==4.55.4",
]

[project.scripts]
inference-lab = "inference_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "graphifyy==0.9.55",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "ANN401",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D202",
    "D400",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF022",
    "TID252",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103", "D104"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = ["inference_lab"]

[tool.coverage.report]
fail_under = 80
show_missing = true
