[project]
name = "inference-lab"
version = "0.1.0"
description = "Local, provenance-preserving question answering over papers and patents"
authors = [
    { name = "C-Gibson20", email = "cg.c0d3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fonttools==4.66.0",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.15.0",
    "pypdf==6.19.0",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "torch==2.8.0",
    "transformers==4.55.4",
]

[project.scripts]
inference-lab = "inference_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "graphifyy==0.9.55",
    "jsonschema>=4.26.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "ANN401",
    "C901",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D202",
    "D400",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "RUF022",
    "TID252",
]

# Complexity thresholds are regression tripwires, not targets. They sit just
# above ordinary code so a new oversized function fails review, and the files
# listed below are the known decomposition backlog rather than an allowance to
# add more. Remove an entry when its function is split; do not add entries.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-statements = 80

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103", "D104"]
"tests/inference_lab/evaluation/test_audit_golden_matrix.py" = ["PLR0913"]
"tests/inference_lab/ingest/test_baseline_publication_acceptance.py" = ["PLR0915"]
"tests/inference_lab/ingest/test_identity_isolation_acceptance.py" = ["PLR0915"]
"tests/inference_lab/storage/test_persistent_index_systems_acceptance.py" = ["PLR0915"]
"src/inference_lab/backends/runtime/_memory_values.py" = ["C901", "PLR0912"]
"src/inference_lab/evaluation/heldout_gate.py" = ["C901", "PLR0912"]
"src/inference_lab/ingest/_chunk_identity.py" = ["PLR0913"]
"src/inference_lab/ingest/_chunk_windows.py" = ["PLR0913"]
"src/inference_lab/ingest/baseline_execution.py" = ["C901"]
"src/inference_lab/ingest/baseline_parse.py" = ["PLR0913"]
"src/inference_lab/profiling/observed.py" = ["PLR0913"]
"src/inference_lab/profiling/timing.py" = ["PLR0913"]
"src/inference_lab/retrieval/dense_retrieval.py" = ["C901", "PLR0912"]
"src/inference_lab/retrieval/dense_store.py" = ["C901", "PLR0912", "PLR0915"]
"src/inference_lab/retrieval/hybrid.py" = ["PLR0913"]
"src/inference_lab/retrieval/lexical.py" = ["C901", "PLR0912"]
"src/inference_lab/retrieval/reduction_adapter.py" = ["C901", "PLR0912"]
"src/inference_lab/serving/ingest_contracts.py" = ["C901", "PLR0912"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = ["inference_lab"]

[tool.coverage.report]
fail_under = 70
show_missing = true
